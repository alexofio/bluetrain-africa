    <!--route-meta-->
    <!-- Set the theme before first paint to avoid a flash: saved choice, else system setting -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("bluetrain-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "light" ? "#f6f7f7" : "#102A43");
      })();
    </script>
