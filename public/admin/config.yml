# Bluetrain Informed editor — bluetrain.africa/admin
# Each article is saved as content/informed/<slug>.md in the GitHub repo. Saving commits to main,
# which triggers Cloudflare to rebuild and publish the site (about a minute).
# Category, market and format values must match src/content/informed.js.

backend:
  name: github
  repo: alexofio/bluetrain-africa
  branch: main
  base_url: https://bluetrain.africa # sign-in runs on the site's own Worker (/auth, /callback)
  commit_messages:
    create: "Informed: publish “{{slug}}”"
    update: "Informed: update “{{slug}}”"
    delete: "Informed: remove “{{slug}}”"
    uploadMedia: "Informed: upload {{path}}"
    deleteMedia: "Informed: delete {{path}}"

site_url: https://bluetrain.africa
display_url: https://bluetrain.africa
logo:
  src: /favicon.svg

media_folder: public/images/informed
public_folder: /images/informed

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: informed
    label: Bluetrain Informed
    label_singular: Article
    description: Articles, market briefs and news for bluetrain.africa/informed. Tick "Draft" to save without publishing.
    folder: content/informed
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{title}}"
    preview_path: informed/{{slug}}
    summary: "{{title}} · {{date}}{{draft | ternary(' · DRAFT', '')}}"
    sortable_fields: [date, title, category]
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
      - { label: Featured, field: featured, pattern: true }
    fields:
      # ── The essentials ─────────────────────────────────────────────
      - { label: Title, name: title, widget: string, hint: "The headline. Also becomes the page address, so choose it carefully before the first save." }
      - { label: Summary, name: standfirst, widget: text, hint: "One or two sentences under the headline. Also used by Google and in link previews." }
      - label: Publish date
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        default: "{{now}}"
      - label: Category
        name: category
        widget: select
        options:
          - { label: Strategy, value: strategy }
          - { label: Performance & Media, value: performance }
          - { label: Insights & Listening, value: insights }
          - { label: Influence & Social, value: influence }
          - { label: Experiences, value: experiences }
          - { label: Technology, value: technology }
          - { label: Bluetrain News, value: news }
      - label: Format
        name: format
        widget: select
        default: article
        options:
          - { label: Article, value: article }
          - { label: Market Brief, value: brief }
          - { label: News, value: news }
      - label: Markets
        name: markets
        widget: select
        multiple: true
        default: [AF]
        options:
          - { label: Tanzania, value: TZ }
          - { label: Kenya, value: KE }
          - { label: South Africa, value: ZA }
          - { label: Zambia, value: ZM }
          - { label: Pan-Africa, value: AF }
      - { label: Author, name: author, widget: string, default: "Bluetrain Informed" }
      - { label: Author role, name: author_role, widget: string, required: false, hint: "e.g. Head of Strategy, Bluetrain Kenya" }

      # ── Cover ──────────────────────────────────────────────────────
      - { label: Cover photo, name: cover_image, widget: image, required: false, hint: "Optional. Landscape, at least 1600 × 900. Without a photo, the article gets generated brand artwork." }
      - { label: Cover photo description, name: cover_alt, widget: string, required: false, hint: "Describe the photo for screen readers." }
      - { label: Artwork pattern, name: cover_art, widget: number, value_type: int, min: 1, max: 12, required: false, hint: "Only used without a photo. Try different numbers (1–12) for a different design." }

      # ── Article ────────────────────────────────────────────────────
      - label: Key takeaways
        name: takeaways
        widget: list
        hint: "Two to four short points, shown beside the article."
        field: { label: Takeaway, name: item, widget: string }
      - label: Article
        name: body
        widget: markdown
        hint: "Use Heading 2 for section titles. Bold, links, bullet lists, quotes and images all work. Add an image description; text after it in quotes becomes a caption."

      # ── Swahili (optional) ─────────────────────────────────────────
      - { label: "Swahili · Title", name: sw_title, widget: string, required: false }
      - { label: "Swahili · Summary", name: sw_standfirst, widget: text, required: false }
      - label: "Swahili · Key takeaways"
        name: sw_takeaways
        widget: list
        required: false
        field: { label: Takeaway, name: item, widget: string }
      - { label: "Swahili · Article", name: sw_body, widget: markdown, required: false, hint: "Leave empty to show the English article to Swahili readers, with a short note." }

      # ── Publishing ─────────────────────────────────────────────────
      - { label: Featured, name: featured, widget: boolean, default: false, hint: "Shows the article large at the top of the Informed page." }
      - { label: Reading time (minutes), name: read_time, widget: number, value_type: int, required: false, hint: "Leave empty to calculate it from the word count." }
      - { label: Draft, name: draft, widget: boolean, default: false, hint: "Ticked = saved but not shown on the site." }
